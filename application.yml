#Eureka Config
eureka.client.service-url.defaultZone: http://localhost:8761/eureka

management:
  endpoints:
      web:
        exposure:
          include: "*"
eureka:                                                                                                                                                                       
      instance:                                                                                                                                                                   
        instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}   
