spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2
#             - RedirectTo=302, http://codingshuttle.com
                - name: LoggingOrdersFilter
                - name: Authentication
                  args:
                    isEnabled: true
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=2
                - AddRequestHeader=X-Custom-Header, Saif
                - name: Authentication

server:
  port: 8081
#Eureka Config
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
